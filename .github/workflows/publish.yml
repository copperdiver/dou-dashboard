name: Публикация образов

# Собирает образы и кладёт их в GitHub Container Registry.
#
# Образов два, а не три: сервисы worker и migrate в docker-compose.yml
# отличаются только командой запуска, поэтому им хватает одного образа —
# собранного из Dockerfile.worker.

on:
  push:
    branches: [main]
    tags: ['v*']
  # Ручной запуск: чтобы пересобрать прод без пустого коммита.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Незавершённые сборки той же ветки отменяются: на прод всё равно уедет
# только последняя, а очередь занимать незачем. Теги не трогаем — каждый
# релиз должен собраться до конца.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Проверки идут отдельной задачей и до сборки: образ, который не проходит
  # тесты, не должен попасть в реестр даже как промежуточный тег.
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

  build:
    name: Образ ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Без этого пуш в GHCR отвечает 403 даже с валидным токеном.
      packages: write

    strategy:
      # Один упавший образ не должен отменять сборку второго: чаще всего
      # ломается что-то одно, и второй лог нужен целиком.
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: worker
            dockerfile: Dockerfile.worker

    steps:
      - uses: actions/checkout@v4

      # Имя пакета в GHCR обязано быть в нижнем регистре, а github.repository
      # повторяет написание владельца. Приводим явно, иначе пуш падает
      # на репозиториях с заглавными буквами.
      - name: Имя образа
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Сборка и пуш
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Один архитектурный вариант: прод на amd64. Для arm64 добавить
          # linux/arm64 — сборка станет примерно вдвое дольше.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кеш слоёв между прогонами: npm ci и next build — самые долгие шаги.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
