name: Publish images

# Builds images and pushes them to the GitHub Container Registry.
#
# Two images, not three: the worker and migrate services in
# docker-compose.yml differ only in their run command, so one image built
# from Dockerfile.worker covers both.

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual trigger: rebuild production without an empty commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# In-progress runs on the same branch are cancelled: only the latest one
# ever ships to production, so there's no point holding the queue. Tags
# are left alone. Every release build must run to completion.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Checks run as a separate job, before the build: an image that fails
  # the tests shouldn't reach the registry, not even as an intermediate tag.
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  build:
    name: Image ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Without this, pushing to GHCR returns 403 even with a valid token.
      packages: write

    strategy:
      # One failed image shouldn't cancel the build of the other: usually
      # only one thing breaks, and the other log is needed in full.
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: worker
            dockerfile: Dockerfile.worker

    steps:
      - uses: actions/checkout@v4

      # The package name in GHCR must be lowercase, but github.repository
      # preserves the owner's original casing. We lowercase it explicitly,
      # otherwise the push fails on repositories with uppercase letters.
      - name: Image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # One architecture: production runs on amd64. To add arm64,
          # append linux/arm64. The build will take roughly twice as long.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache between runs: npm ci and next build are the slowest steps.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
