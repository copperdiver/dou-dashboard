name: dou-dashboard

# Production: images come from GHCR, nothing is built locally.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Only this file and .env need to be copied to the server. The code
# ships inside the images.
#
# Ingress is Traefik on the external `proxy` network: it terminates TLS
# and gets its own certificate. So no port is published here, not even
# for web: Traefik reaches it over the internal network, and `expose`
# just declares the port on that network.

x-app-env: &app-env
  NODE_ENV: production
  TZ: ${TZ:-Europe/Moscow}
  DATABASE_URL: postgres://${POSTGRES_USER:-dou}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@dou-postgres:5432/${POSTGRES_DB:-dou_dashboard}
  REDIS_URL: redis://dou-redis:6379

# Source settings are needed by both services, not just the worker: the
# status page runs a one-off connectivity check on button click, using
# the same client. If the settings drifted, that check would stop
# testing what actually happens in the pipeline: the default UA gets a
# 403 from the source, and a 403 writes a pause to Redis shared with the
# worker. Diagnostics would end up blocking the thing they were opened
# to diagnose.
x-dou-env: &dou-env
  # The default UA gets a 403 from the source, so a browser UA is required.
  DOU_USER_AGENT: ${DOU_USER_AGENT:?DOU_USER_AGENT is required in .env}
  # Proxy is only needed where the server's address is blocked by the
  # source. Empty means requests go direct. Only applies to in.gov.br:
  # LLM traffic isn't routed through it, or a residential-proxy plan
  # would end up billing for the model's responses too.
  DOU_PROXY_URL: ${DOU_PROXY_URL:-}
  DOU_MIN_INTERVAL_MS: ${DOU_MIN_INTERVAL_MS:-2000}
  DOU_MAX_REQUESTS_PER_DAY: ${DOU_MAX_REQUESTS_PER_DAY:-5000}
  DOU_SECTIONS: ${DOU_SECTIONS:-do1}

# Image and tag are set via IMAGE_PREFIX and IMAGE_TAG: rolling back to
# a previous version is an .env edit and `up -d`, no changes to this
# file needed.

services:
  dou-postgres:
    image: postgres:18-alpine
    container_name: dou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dou_dashboard}
      TZ: ${TZ:-Europe/Moscow}
      # Session timezone: daily stats grouping depends on it.
      PGTZ: ${TZ:-Europe/Moscow}
    volumes:
      - dou_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dou} -d ${POSTGRES_DB:-dou_dashboard}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  dou-redis:
    image: redis:8-alpine
    container_name: dou-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - dou_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot service: applies migrations, seeds reference data, exits.
  # web and worker wait for it to exit successfully, so there's no race
  # against the schema on startup. Country/state reference data isn't
  # demo data: country_raw/state_raw matching doesn't work without it,
  # so it's part of the deployment, not a separate step.
  dou-migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/dou-dashboard}-worker:${IMAGE_TAG:-latest}
    container_name: dou-migrate
    command:
      - sh
      - -c
      - ./node_modules/.bin/tsx src/db/migrate.ts && ./node_modules/.bin/tsx src/db/seed-reference.ts
    restart: 'no'
    environment: *app-env
    depends_on:
      dou-postgres:
        condition: service_healthy

  dou-web:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/dou-dashboard}-web:${IMAGE_TAG:-latest}
    container_name: dou-web
    restart: unless-stopped
    environment:
      <<: [*app-env, *dou-env]
      # Canonical links and hreflang. No NEXT_PUBLIC_ prefix on purpose:
      # Next inlines those at build time, so they couldn't be set here.
      SITE_URL: https://${PUBLIC_HOST:-example.com}
      # Analytics. Empty means the tracker isn't loaded: an unset
      # variable shouldn't silently ship data from someone else's
      # environment.
      CLARITY_ID: ${CLARITY_ID:-}
    depends_on:
      dou-postgres:
        condition: service_healthy
      dou-migrate:
        condition: service_completed_successfully
    expose:
      - '3000'
    networks:
      - default
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.dou-web.entrypoints=websecure'
      - 'traefik.http.routers.dou-web.tls=true'
      - 'traefik.http.routers.dou-web.tls.certresolver=le'
      - 'traefik.http.routers.dou-web.rule=Host(`${PUBLIC_HOST:-example.com}`)'
      - 'traefik.http.services.dou-web.loadbalancer.server.port=3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dou-worker:
    image: ${IMAGE_PREFIX:-ghcr.io/your-org/dou-dashboard}-worker:${IMAGE_TAG:-latest}
    container_name: dou-worker
    restart: unless-stopped
    # Not on the proxy network: the worker doesn't serve anything, it
    # only calls out to in.gov.br and the LLM provider.
    environment:
      <<: [*app-env, *dou-env]
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_LLM_CONCURRENCY: ${WORKER_LLM_CONCURRENCY:-1}
      DISCOVER_LOOKBACK_DAYS: ${DISCOVER_LOOKBACK_DAYS:-7}
      ENUMERATE_BATCH: ${ENUMERATE_BATCH:-5}
      FETCH_BATCH: ${FETCH_BATCH:-10}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-365}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL_CLAUDE: ${LLM_MODEL_CLAUDE:-}
      LLM_MODEL_OPENAI: ${LLM_MODEL_OPENAI:-}
      # Keys come from .env and never end up baked into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      dou-postgres:
        condition: service_healthy
      dou-redis:
        condition: service_healthy
      dou-migrate:
        condition: service_completed_successfully

networks:
  # Traefik's network. Not created here: it's shared across every
  # project on the server.
  proxy:
    external: true

volumes:
  dou_pgdata:
  dou_redisdata:
